<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | SalonHub</title>

    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="admin-login">

    <div class="login-box">

        <h1>Admin Login</h1>

        <p>Salon Management System</p>

        <form id="loginForm">

            <input
                type="text"
                id="username"
                placeholder="Username"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

    </div>

</div>

<script src="../js/admin-login.js"></script>

</body>
</html>

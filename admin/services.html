<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Services | SalonHub</title>

    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="dashboard">

    <!-- Sidebar -->
    <aside class="sidebar">

        <h2>SalonHub</h2>

        <ul>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="services.html" class="active">Services</a></li>
            <li><a href="bookings.html">Bookings</a></li>
            <li><a href="#">Customers</a></li>
            <li><a href="#">Gallery</a></li>
            <li><a href="settings.html">Settings</a></li>
            <li><a href="#" id="logoutBtn">Logout</a></li>
        </ul>

    </aside>

    <!-- Main Content -->
    <main class="main-content">

        <h1>Manage Services</h1>

        <div class="services-header">
            <button class="add-service-btn">
                + Add New Service
            </button>
        </div>

        <table class="services-table">

            <thead>
                <tr>
                    <th>Image</th>
                    <th>Service Name</th>
                    <th>Price</th>
                    <th>Duration</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="servicesTableBody">
                <!-- Services Loaded Here -->
            </tbody>

        </table>

        <!-- Popup -->

        <div class="popup" id="servicePopup">

            <div class="popup-content">

                <h2>Add / Edit Service</h2>

                <form id="serviceForm">

                    <input
                        type="text"
                        id="serviceName"
                        placeholder="Service Name"
                        required
                    >

                    <input
                        type="number"
                        id="servicePrice"
                        placeholder="Price"
                        required
                    >

                    <input
                        type="text"
                        id="serviceDuration"
                        placeholder="Duration (Example: 30 Min)"
                        required
                    >

                    <textarea
                        id="serviceDescription"
                        placeholder="Description"
                    ></textarea>

                    <input
                        type="file"
                        id="serviceImage"
                    >

                    <div class="popup-buttons">

                        <button type="submit">
                            Save
                        </button>

                        <button
                            type="button"
                            id="cancelBtn"
                        >
                            Cancel
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </main>

</div>

<script src="../js/script.js"></script>
<script src="../js/admin-services.js"></script>

</body>
</html>

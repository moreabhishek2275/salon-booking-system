<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | SalonHub</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<div class="dashboard">

    <!-- =========================
            SIDEBAR
    ========================= -->

    <aside class="sidebar">

        <h2>SalonHub</h2>

        <ul>
            <li>
                <a href="dashboard.html">Dashboard</a>
            </li>

            <li>
                <a href="services.html">Services</a>
            </li>

            <li>
                <a href="bookings.html">Bookings</a>
            </li>

            <li>
                <a href="customers.html">Customers</a>
            </li>

            <li>
                <a href="gallery.html">Gallery</a>
            </li>

            <li>
                <a href="settings.html" class="active">Settings</a>
            </li>

            <li>
                <a href="#" id="logoutBtn">Logout</a>
            </li>
        </ul>

    </aside>


    <!-- =========================
            MAIN CONTENT
    ========================= -->

    <main class="main-content">

        <h1>Salon Settings</h1>

        <div class="settings-container">

            <!-- Settings Header -->

            <div class="settings-header">

                <div>
                    <h2>Salon Information</h2>

                    <p>
                        Manage your salon contact information
                        and business details.
                    </p>
                </div>

            </div>


            <!-- Settings Form -->

            <form id="settingsForm" class="settings-form">

                <!-- Salon Name -->

                <div class="form-group">

                    <label for="salonName">
                        Salon Name
                    </label>

                    <input
                        type="text"
                        id="salonName"
                        placeholder="Enter salon name"
                        required
                    >

                </div>


                <!-- Phone -->

                <div class="form-group">

                    <label for="salonPhone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="salonPhone"
                        placeholder="Enter phone number"
                        required
                    >

                </div>


                <!-- Email -->

                <div class="form-group">

                    <label for="salonEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="salonEmail"
                        placeholder="Enter salon email"
                        required
                    >

                </div>


                <!-- Address -->

                <div class="form-group">

                    <label for="salonAddress">
                        Salon Address
                    </label>

                    <textarea
                        id="salonAddress"
                        placeholder="Enter complete salon address"
                        rows="5"
                        required
                    ></textarea>

                </div>


                <!-- Buttons -->

                <div class="settings-actions">

                    <button
                        type="submit"
                        class="save-settings-btn"
                    >
                        Save Settings
                    </button>

                </div>

            </form>

        </div>

    </main>

</div>


<!-- =========================
        JAVASCRIPT
========================= -->

<script src="../js/script.js"></script>

<script src="../js/admin-settings.js"></script>

</body>
</html>
